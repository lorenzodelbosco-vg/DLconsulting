<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
>
    <defs>
        <linearGradient
            id="gradiente"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0%" stop-color="#8f68ff"/>
            <stop offset="100%" stop-color="#64eaff"/>
        </linearGradient>

        <filter id="bagliore">
            <feGaussianBlur
                stdDeviation="1.5"
                result="sfocatura"
            />

            <feMerge>
                <feMergeNode in="sfocatura"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect
        width="64"
        height="64"
        rx="16"
        fill="#0b0c18"
    />

    <circle
        cx="32"
        cy="32"
        r="23"
        fill="none"
        stroke="url(#gradiente)"
        stroke-width="2"
        opacity="0.8"
    />

    <path
        d="M18 19H28C38 19 44 24 44 32C44 40 38 45 28 45H18V19ZM24 25V39H28C34 39 38 37 38 32C38 27 34 25 28 25H24Z"
        fill="url(#gradiente)"
        filter="url(#bagliore)"
    />

    <path
        d="M42 19H48V45H42Z"
        fill="#ffffff"
        opacity="0.9"
    />
</svg>